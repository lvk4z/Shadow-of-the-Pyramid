<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -22 24 50" width="48" height="100">
  <!-- Outer flame glow -->
  <ellipse cx="0" cy="-13" rx="6" ry="9" fill="#FF4400" opacity="0.9"/>
  <!-- Mid flame -->
  <ellipse cx="0" cy="-11" rx="4" ry="7" fill="#FF8800" opacity="0.95"/>
  <!-- Inner flame -->
  <ellipse cx="0" cy="-9" rx="2.5" ry="5" fill="#FFCC00"/>
  <!-- Flame core -->
  <ellipse cx="0" cy="-8" rx="1.2" ry="3" fill="#FFEE99"/>
  <!-- Wrap / binding -->
  <rect x="-5.5" y="0" width="11" height="8" rx="1.5" fill="#7A5010"/>
  <rect x="-5" y="1" width="10" height="1.5" fill="#9A6820" opacity="0.7"/>
  <rect x="-5" y="4.5" width="10" height="1.5" fill="#9A6820" opacity="0.7"/>
  <!-- Handle -->
  <rect x="-3" y="8" width="6" height="18" rx="1.5" fill="#5A3010"/>
  <!-- Handle grain lines -->
  <line x1="-1" y1="10" x2="-1" y2="24" stroke="#7A4A20" stroke-width="0.8" opacity="0.5"/>
  <line x1="1" y1="10" x2="1" y2="24" stroke="#7A4A20" stroke-width="0.8" opacity="0.5"/>
</svg>
